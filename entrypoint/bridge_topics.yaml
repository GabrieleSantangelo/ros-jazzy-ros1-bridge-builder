# Static topic/service list for `ros1_bridge parameter_bridge`, loaded onto
# the ROS 1 parameter server by load_ros1_params.py before the bridge starts.
# Add more entries here as needed -- no rebuild required, just restart the
# container.
#
# Two placeholders are resolved by load_ros1_params.py from the environment,
# which the Makefile fills in:
#
#   {ns}            -> $NAMESPACE. Empty collapses the slash, so
#                      "/{ns}/sensor_measurements/odom" becomes
#                      "/sensor_measurements/odom".
#   when: sim_time  -> the entry is kept only if $USE_SIM_TIME is true.
#
#   make run NAMESPACE=robot0 USE_SIM_TIME=true
#
# NOTE: parameter_bridge only supports *bidirectional* topic bridges (see
# ros1_bridge/src/parameter_bridge.cpp). The "direction" below is enforced
# in practice by whichever side actually publishes -- e.g. /clock only
# flows ROS2->ROS1 because nothing publishes it on the ROS1 side, not
# because the bridge enforces it.
topics:
  # /clock: ROS2 -> ROS1. Only bridged with USE_SIM_TIME=true: a ROS 1 side
  # on wall time must not get a simulated clock, and one on sim time is dead
  # without it.
  - topic: /clock
    type: rosgraph_msgs/msg/Clock
    queue_size: 10
    when: sim_time

  # /tf: ROS2 <-> ROS1. Global, never namespaced, always bridged.
  - topic: /tf
    type: tf2_msgs/msg/TFMessage
    queue_size: 100

  # /tf_static: ROS2 <-> ROS1. Same, plus it relies on tf_static_repeater.py
  # (run alongside this bridge) to merge transforms from every ROS2 static
  # publisher before they hit the 2-to-1 direction -- see the comment in that
  # script for why.
  - topic: /tf_static
    type: tf2_msgs/msg/TFMessage
    queue_size: 100

  # /{ns}/sensor_measurements/lidar/points: ROS2 -> ROS1
  - topic: /{ns}/sensor_measurements/lidar/points
    type: sensor_msgs/msg/PointCloud2
    queue_size: 10

  # /{ns}/sensor_measurements/odom: ROS2 -> ROS1
  - topic: /{ns}/sensor_measurements/odom
    type: nav_msgs/msg/Odometry
    queue_size: 10

  # /{ns}/command/trajectory: ROS1 -> ROS2
  - topic: /{ns}/command/trajectory
    type: trajectory_msgs/msg/MultiDOFJointTrajectory
    queue_size: 10

  # /{ns}/move_base_simple/goal: ROS2 -> ROS1. Waypoint goal consumed by the
  # ROS 1 gbplanner pci node (same topic RViz's "2D Nav Goal" publishes on).
  - topic: /{ns}/move_base_simple/goal
    type: geometry_msgs/msg/PoseStamped
    queue_size: 10

  # ---------------------------------------------------------------------------
  # Planner visualisation: ROS1 -> ROS2.
  #
  # Everything gbplanner draws lives on its own ROS 1 master, so RViz inside the
  # planner container is the only place it can be seen -- and only for the one
  # robot that container belongs to. Bridging these puts every robot's planning
  # state into the single ROS 2 graph, where one Foxglove or RViz 2 session
  # shows the whole fleet at once.
  #
  # Cost, before adding more: gbplanner's visualiser is lazy, every publisher is
  # guarded by `if (pub.getNumSubscribers() < 1) return;`. A bridged topic has
  # the bridge as a permanent subscriber, so those markers are now built on
  # every planning iteration whether or not anyone is looking. Keep this list to
  # what you actually watch.
  #
  # All standard message types -- no custom package is involved, so none of this
  # needs the bridge image rebuilt. Editing this file and restarting the bridge
  # container is enough.

  # The path the planner settled on, and the b-spline actually commanded.
  # Both plain nav_msgs/Path, so they can be logged or replayed without
  # unpacking markers; comparing the two shows the smoothing error.
  - topic: /{ns}/gbplanner_path
    type: nav_msgs/msg/Path
    queue_size: 10

  - topic: /{ns}/command_traj_vis
    type: nav_msgs/msg/Path
    queue_size: 10

  # The reference path: ns "ref_path" is the magenta LINE_LIST, ns "vertices"
  # the spheres between waypoints. What appears once automatic_planning runs.
  - topic: /{ns}/vis/ref_path
    type: visualization_msgs/msg/MarkerArray
    queue_size: 10

  # The local RRG the path was chosen from -- the "why" behind ref_path.
  - topic: /{ns}/vis/planning_graph
    type: visualization_msgs/msg/MarkerArray
    queue_size: 10

  # Global path towards the frontier the planner is heading for.
  - topic: /{ns}/vis/planning_global_path
    type: visualization_msgs/msg/MarkerArray
    queue_size: 10

  # Markers at the vertices where planning failed. Published only on a failure,
  # so it costs nothing while things work.
  - topic: /{ns}/vis/planning_failed
    type: visualization_msgs/msg/MarkerArray
    queue_size: 10

  # The local navigation goal the planner is currently driving at.
  - topic: /{ns}/gbplanner/local_target_viz
    type: geometry_msgs/msg/PointStamped
    queue_size: 10

  # Left out on purpose, all visualization_msgs/msg/MarkerArray -- uncomment
  # what you need, no rebuild required:
  #
  #   vis/best_planning_paths   the candidates ref_path was chosen from
  #   vis/volumetric_gains      per-viewpoint exploration gain (bound cube +
  #                             the unknown voxels it would clear). The most
  #                             informative display there is, and the most
  #                             expensive to keep subscribed
  #   vis/state_history         everywhere the robot has been; reveals loops
  #   vis/sampler               valid/invalid samples, for a starved sampler
  #   vis/planning_global_graph the global graph; a fog of vertices once big
  #
  # NOT bridgeable: gbplanner_node/mesh is voxblox_msgs/Mesh, and the bridge
  # only carries conversion factories for the standard packages plus
  # planner_msgs. Adding voxblox_msgs means putting it in the builder's
  # custom_msgs workspaces and rebuilding the image. Use
  # gbplanner_node/surface_pointcloud (sensor_msgs/msg/PointCloud2) instead if
  # the map itself is wanted on the ROS 2 side -- at the bandwidth that implies.

# Every service below is hosted natively on the ROS 1 side -- the first four
# by /{ns}/pci_general_ros_node, the two gbplanner ones by the gbplanner node
# (confirmed via `rosservice info`), so they
# belong under services_2_to_1: per ros1_bridge/include/ros1_bridge/factory.hpp,
# service_bridge_2_to_1() creates a ROS 2 *server* (proxy) backed by a ROS 1
# *client* -- i.e. it makes an existing ROS 1 server callable from ROS 2.
# services_1_to_2 is the other way around (ROS 2 client + ROS 1 server
# proxy) and requires the real server to already exist on the ROS 2 side,
# which is NOT the case here.
#
# NOTE on "type" format: services_2_to_1 resolves the factory with
# ros_id == "ros1" (see get_service_factory_*__srv__*.cpp), which matches
# against the ROS 1-style string "pkg/TypeName" -- no "srv/" in the middle,
# and exact ROS 1 case (e.g. the literal .srv filename for custom types).
# This is different from services_1_to_2, which wants the ROS 2-style
# "pkg/srv/TypeName".
#
# The ROS 2 *client* still uses the ROS 2 name of the same type, which for
# custom types is the CamelCase one rosidl generates from the .srv filename:
#   ros2 service call /robot0/pci_initialization_trigger \
#       planner_msgs/srv/PciInitialization
# ("planner_msgs/srv/pci_initialization" is rejected as an invalid type.)
services_2_to_1:
  - service: /{ns}/planner_control_interface/std_srvs/automatic_planning
    type: std_srvs/Trigger

  - service: /{ns}/pci_initialization_trigger
    type: planner_msgs/pci_initialization

  - service: /{ns}/planner_control_interface/std_srvs/stop
    type: std_srvs/Trigger

  - service: /{ns}/planner_control_interface/std_srvs/single_planning
    type: std_srvs/Trigger

  # ROS 2 client side: planner_msgs/srv/PlannerGoToWaypoint
  - service: /{ns}/gbplanner/go_to_waypoint
    type: planner_msgs/planner_go_to_waypoint

  - service: /{ns}/gbplanner/switch_operation_mode
    type: std_srvs/SetBool

# services_1_to_2:
#   - service: /service_name
#     type: pkgname/srv/SrvName
